<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" shape-rendering="crispEdges">
  <!-- Top Vine -->
  <g transform="translate(18, 2) scale(0.6)">
    <rect x="2" y="24" width="4" height="2" fill="#2F4232" />
    <rect x="6" y="20" width="4" height="4" fill="#2F4232" />
    <rect x="10" y="16" width="6" height="4" fill="#4B6A4E" />
    <rect x="16" y="12" width="6" height="4" fill="#4B6A4E" />
    <rect x="22" y="8" width="6" height="4" fill="#6B8E6E" />
    <rect x="28" y="4" width="6" height="4" fill="#6B8E6E" />
    <rect x="34" y="0" width="6" height="4" fill="#8EA891" />
    <!-- Leaves -->
    <rect x="8" y="12" width="4" height="4" fill="#6B8E6E" />
    <rect x="14" y="6" width="4" height="4" fill="#8EA891" />
    <rect x="20" y="2" width="4" height="4" fill="#8EA891" />
    <rect x="14" y="18" width="4" height="4" fill="#4B6A4E" />
    <rect x="20" y="14" width="4" height="4" fill="#6B8E6E" />
    <rect x="26" y="10" width="4" height="4" fill="#8EA891" />
    <!-- Berries/Buds -->
    <rect x="18" y="18" width="2" height="4" fill="#C9A468" />
    <rect x="24" y="14" width="2" height="4" fill="#C9A468" />
  </g>
  <!-- Pixel Mushroom / Fern Bottom Right -->
  <g transform="translate(24, 28) scale(0.55)">
    <rect x="0" y="22" width="36" height="3" fill="#2F4232" />
    <!-- Mushroom Cap -->
    <rect x="12" y="6" width="12" height="6" fill="#592331" />
    <rect x="10" y="10" width="16" height="6" fill="#8C3545" />
    <rect x="14" y="8" width="2" height="2" fill="#FFFFFF" />
    <rect x="20" y="10" width="2" height="2" fill="#FFFFFF" />
    <!-- Stem -->
    <rect x="15" y="16" width="6" height="6" fill="#EEE7DA" />
    <!-- Left Fern -->
    <rect x="2" y="16" width="6" height="3" fill="#4B6A4E" />
    <rect x="4" y="12" width="6" height="3" fill="#6B8E6E" />
    <rect x="6" y="8" width="6" height="3" fill="#8EA891" />
    <!-- Right Fern -->
    <rect x="28" y="16" width="6" height="3" fill="#4B6A4E" />
    <rect x="26" y="12" width="6" height="3" fill="#6B8E6E" />
    <rect x="24" y="8" width="6" height="3" fill="#8EA891" />
  </g>
</svg>