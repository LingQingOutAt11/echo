# Echo standalone stack (独立于 xiaokai / yixue,不触碰其它服务)
# 用法: docker compose -f deploy/docker-compose.yml -p echo up -d --build
services:
  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    image: echo/api:latest
    container_name: echo-api
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      PORT: "3000"
      COMPANION_API_KEY: ${COMPANION_API_KEY:-sk-hack-13bfdc6a38a7d4719a980ae09039fef6}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
    image: echo/web:latest
    container_name: echo-web
    restart: unless-stopped
    ports:
      - "8090:80"
    depends_on:
      - api
